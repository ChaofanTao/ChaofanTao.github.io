<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="t d">
  <title id="t">智能体的学习循环</title>
  <desc id="d">智能体由模型和 harness 组成，它在一个由四个环节组成的循环里学习：行动所在的环境、收集到的经验、把经验转化为学习的信号，以及检验结果的评测。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b509ac"/>
    </marker>
  </defs>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",Inter,-apple-system,Roboto,sans-serif;fill:#1f2328}
    .h{font-size:17px;font-weight:600}
    .s{font-size:13px;fill:#4a525c}
    .w{font-size:11.5px;fill:#8a1f84}
    .box{fill:#fff;stroke:#b509ac;stroke-width:1.5}
    .arc{fill:none;stroke:#b509ac;stroke-width:2}
  </style>
  <rect width="760" height="480" rx="14" fill="#f7f7fa"/>
  <circle cx="380" cy="240" r="80" fill="#fff" stroke="#d6d8de" stroke-width="1.5"/>
  <text x="380" y="234" text-anchor="middle" class="h">智能体</text>
  <text x="380" y="257" text-anchor="middle" class="s">模型 + harness</text>

  <rect class="box" x="265" y="28" width="230" height="96" rx="10"/>
  <text x="380" y="56" text-anchor="middle" class="h">1 · 环境</text>
  <text x="380" y="79" text-anchor="middle" class="s">harness、沙箱、网页、机器人</text>
  <text x="380" y="104" text-anchor="middle" class="w">Lego-RL · MMSearch-Plus · RoboCodeX</text>

  <rect class="box" x="505" y="192" width="230" height="96" rx="10"/>
  <text x="620" y="220" text-anchor="middle" class="h">2 · 经验</text>
  <text x="620" y="243" text-anchor="middle" class="s">可验证的任务与轨迹</text>
  <text x="620" y="268" text-anchor="middle" class="w">LegoFlow · SWE-Lego · Terminal-Lego</text>

  <rect class="box" x="265" y="356" width="230" height="96" rx="10"/>
  <text x="380" y="384" text-anchor="middle" class="h">3 · 信号</text>
  <text x="380" y="407" text-anchor="middle" class="s">模仿、奖励、反馈</text>
  <text x="380" y="432" text-anchor="middle" class="w" style="font-size:10.5px">SWE-Lego · Lego-RL · RLVRR · OVD · SRPO</text>

  <rect class="box" x="25" y="192" width="230" height="96" rx="10"/>
  <text x="140" y="220" text-anchor="middle" class="h">4 · 评测</text>
  <text x="140" y="243" text-anchor="middle" class="s">基准与审查</text>
  <text x="140" y="268" text-anchor="middle" class="w">SwingArena · SWE-Review · PhyX</text>

  <path class="arc" d="M497 76 Q620 76 620 186" marker-end="url(#a)"/>
  <path class="arc" d="M620 292 Q620 404 501 404" marker-end="url(#a)"/>
  <path class="arc" d="M263 404 Q140 404 140 294" marker-end="url(#a)"/>
  <path class="arc" d="M140 188 Q140 76 259 76" marker-end="url(#a)"/>
</svg>
