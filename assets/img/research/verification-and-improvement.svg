<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">Verification in agent teams and self-improvement loops</title>
  <desc id="d">Left: a team organized around verification, where a proposer, a tester and a reviewer see different information and share a memory of claims with evidence and provenance. Right: a self-improvement loop that proposes on search tasks, selects on separate tasks, confirms on fresh tasks never used in search, and inherits improvements to pipelines, environments and verifiers, compared at equal total budget.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b509ac"/></marker>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2328}
    .p{font-size:15px;font-weight:600}
    .h{font-size:14px;font-weight:600}
    .s{font-size:11.5px;fill:#4a525c}
    .k{font-size:12px;fill:#8a1f84;font-style:italic}
    .box{fill:#fff;stroke:#b509ac;stroke-width:1.5}
    .mem{fill:#fff;stroke:#d6d8de;stroke-width:1.5}
    .arr{fill:none;stroke:#b509ac;stroke-width:1.8}
  </style>
  <rect width="960" height="400" rx="14" fill="#f7f7fa"/>
  <line x1="480" y1="30" x2="480" y2="370" stroke="#e3e4e8" stroke-width="1.5"/>

  <text x="240" y="40" text-anchor="middle" class="p">A team organized around verification</text>
  <rect class="box" x="35" y="65" width="125" height="85" rx="10"/>
  <text x="97" y="95" text-anchor="middle" class="h">Proposer</text>
  <text x="97" y="117" text-anchor="middle" class="s">sees the issue</text>
  <text x="97" y="133" text-anchor="middle" class="s">and the repository</text>
  <rect class="box" x="178" y="65" width="125" height="85" rx="10"/>
  <text x="240" y="95" text-anchor="middle" class="h">Tester</text>
  <text x="240" y="117" text-anchor="middle" class="s">sees the spec,</text>
  <text x="240" y="133" text-anchor="middle" class="s">not the proposer's plan</text>
  <rect class="box" x="321" y="65" width="125" height="85" rx="10"/>
  <text x="383" y="95" text-anchor="middle" class="h">Reviewer</text>
  <text x="383" y="117" text-anchor="middle" class="s">explores the repo</text>
  <text x="383" y="133" text-anchor="middle" class="s">on its own</text>
  <path class="arr" d="M97 152 L97 218" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="arr" d="M240 152 L240 218" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="arr" d="M383 152 L383 218" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="mem" x="35" y="222" width="411" height="92" rx="10"/>
  <text x="240" y="252" text-anchor="middle" class="h">Shared memory</text>
  <text x="240" y="275" text-anchor="middle" class="s">claims + evidence + provenance</text>
  <text x="240" y="294" text-anchor="middle" class="s">which data, which code version, which settings</text>
  <text x="240" y="350" text-anchor="middle" class="k">different information → independent evidence</text>

  <text x="720" y="40" text-anchor="middle" class="p">A self-improvement loop</text>
  <rect class="box" x="510" y="70" width="180" height="72" rx="10"/>
  <text x="600" y="100" text-anchor="middle" class="h">Propose</text>
  <text x="600" y="122" text-anchor="middle" class="s">on search tasks</text>
  <rect class="box" x="750" y="70" width="180" height="72" rx="10"/>
  <text x="840" y="100" text-anchor="middle" class="h">Select</text>
  <text x="840" y="122" text-anchor="middle" class="s">on separate selection tasks</text>
  <rect class="box" x="750" y="242" width="180" height="72" rx="10"/>
  <text x="840" y="272" text-anchor="middle" class="h">Confirm</text>
  <text x="840" y="294" text-anchor="middle" class="s">on fresh tasks never searched</text>
  <rect class="box" x="510" y="242" width="180" height="72" rx="10"/>
  <text x="600" y="268" text-anchor="middle" class="h">Inherit</text>
  <text x="600" y="290" text-anchor="middle" class="s">improved pipelines,</text>
  <text x="600" y="305" text-anchor="middle" class="s">environments, verifiers</text>
  <path class="arr" d="M692 106 L746 106" marker-end="url(#a)"/>
  <path class="arr" d="M840 144 L840 238" marker-end="url(#a)"/>
  <path class="arr" d="M748 278 L694 278" marker-end="url(#a)"/>
  <path class="arr" d="M600 240 L600 146" marker-end="url(#a)"/>
  <text x="720" y="188" text-anchor="middle" class="k">compare rounds at</text>
  <text x="720" y="206" text-anchor="middle" class="k">equal total budget</text>
  <text x="720" y="350" text-anchor="middle" class="k">generating candidates is easy; deciding which are real is the hard part</text>
</svg>
