<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
  <title id="t">Keeping experience at three levels</title>
  <desc id="d">Experience from attempts, failures and reviews is kept at three levels: stable habits in the weights, reusable procedures as skills and tools, and task-specific facts in memory together with the conditions under which they hold.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b509ac"/></marker>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2328}
    .h{font-size:15px;font-weight:600}
    .s{font-size:12.5px;fill:#4a525c}
    .t{font-size:11.5px;fill:#8a1f84;font-style:italic}
    .k{font-size:11.5px;fill:#8a8f98}
    .box{fill:#fff;stroke:#b509ac;stroke-width:1.5}
    .src{fill:#fff;stroke:#d6d8de;stroke-width:1.5}
    .arr{fill:none;stroke:#b509ac;stroke-width:1.8}
  </style>
  <rect width="900" height="380" rx="14" fill="#f7f7fa"/>

  <rect class="src" x="20" y="120" width="210" height="140" rx="10"/>
  <text x="125" y="160" text-anchor="middle" class="h">Experience</text>
  <text x="125" y="186" text-anchor="middle" class="s">attempts · failures</text>
  <text x="125" y="206" text-anchor="middle" class="s">reviews · partial successes</text>
  <text x="125" y="236" text-anchor="middle" class="k">what a long task leaves behind</text>

  <path class="arr" d="M232 165 C255 165 255 77 276 77" marker-end="url(#a)"/>
  <path class="arr" d="M232 190 L276 190" marker-end="url(#a)"/>
  <path class="arr" d="M232 215 C255 215 255 305 276 305" marker-end="url(#a)"/>
  <text x="262" y="64" text-anchor="middle" class="k">distill</text>
  <text x="254" y="180" text-anchor="middle" class="k">package</text>
  <text x="262" y="326" text-anchor="middle" class="k">record</text>

  <rect class="box" x="280" y="30" width="600" height="95" rx="10"/>
  <text x="300" y="60" class="h">Weights · stable habits</text>
  <text x="300" y="84" class="s">inspect before editing · reread your own edit · run the tests</text>
  <text x="300" y="108" class="t">changes slowly, applies everywhere</text>

  <rect class="box" x="280" y="143" width="600" height="95" rx="10"/>
  <text x="300" y="173" class="h">Skills and tools · reusable procedures</text>
  <text x="300" y="197" class="s">set up an environment · verify a task · run an evaluation</text>
  <text x="300" y="221" class="t">versioned and shared across tasks</text>

  <rect class="box" x="280" y="256" width="600" height="95" rx="10"/>
  <text x="300" y="286" class="h">Memory · facts with their conditions</text>
  <text x="300" y="310" class="s">“method A beats B” · data: v3 · code: 4f2a · settings: lr, seed</text>
  <text x="300" y="334" class="t">re-checked whenever its conditions change</text>
</svg>
