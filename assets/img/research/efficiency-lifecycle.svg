<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 325" width="960" height="325" role="img" aria-labelledby="t d">
  <title id="t">Efficiency across the model lifecycle</title>
  <desc id="d">Five connected areas of efficiency research: design, compression, memory, computation and serving, and transfer. Each asks how resources should be allocated.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#b509ac"/>
    </marker>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2328}
    .h{font-size:16px;font-weight:600}
    .l{font-size:10.5px;font-weight:600;letter-spacing:.06em;fill:#8a8f98}
    .q{font-size:12.5px;font-style:italic;fill:#4a525c}
    .w{font-size:11.5px;fill:#8a1f84}
    .box{fill:#fff;stroke:#b509ac;stroke-width:1.5}
    .arr{stroke:#b509ac;stroke-width:2}
  </style>
  <rect width="960" height="325" rx="14" fill="#f7f7fa"/>

  <g transform="translate(20 40)">
    <rect class="box" width="166" height="220" rx="10"/>
    <text x="83" y="32" text-anchor="middle" class="h">1 · Design</text>
    <text x="83" y="64" text-anchor="middle" class="l">QUESTION</text>
    <text x="83" y="86" text-anchor="middle" class="q">How large should</text>
    <text x="83" y="103" text-anchor="middle" class="q">the vocabulary be?</text>
    <text x="83" y="176" text-anchor="middle" class="w">Vocabulary</text>
    <text x="83" y="192" text-anchor="middle" class="w">scaling laws</text>
  </g>
  <g transform="translate(206 40)">
    <rect class="box" width="166" height="220" rx="10"/>
    <text x="83" y="32" text-anchor="middle" class="h">2 · Compress</text>
    <text x="83" y="64" text-anchor="middle" class="l">QUESTION</text>
    <text x="83" y="86" text-anchor="middle" class="q">What distinctions</text>
    <text x="83" y="103" text-anchor="middle" class="q">must survive?</text>
    <text x="83" y="176" text-anchor="middle" class="w">Quantization · Pruning</text>
    <text x="83" y="192" text-anchor="middle" class="w">UPop · CrossGET</text>
  </g>
  <g transform="translate(392 40)">
    <rect class="box" width="166" height="220" rx="10"/>
    <text x="83" y="32" text-anchor="middle" class="h">3 · Remember</text>
    <text x="83" y="64" text-anchor="middle" class="l">QUESTION</text>
    <text x="83" y="86" text-anchor="middle" class="q">What evidence</text>
    <text x="83" y="103" text-anchor="middle" class="q">will be needed later?</text>
    <text x="83" y="176" text-anchor="middle" class="w">D2O · UNComp</text>
    <text x="83" y="192" text-anchor="middle" class="w">Prefilling-dLLM</text>
  </g>
  <g transform="translate(578 40)">
    <rect class="box" width="166" height="220" rx="10"/>
    <text x="83" y="32" text-anchor="middle" class="h">4 · Compute &amp; serve</text>
    <text x="83" y="64" text-anchor="middle" class="l">QUESTION</text>
    <text x="83" y="86" text-anchor="middle" class="q">Where do we wait</text>
    <text x="83" y="103" text-anchor="middle" class="q">or lose work?</text>
    <text x="83" y="176" text-anchor="middle" class="w">ATTS · AnchorTP</text>
    <text x="83" y="192" text-anchor="middle" class="w">agent RL infrastructure</text>
  </g>
  <g transform="translate(764 40)">
    <rect class="box" width="166" height="220" rx="10"/>
    <text x="83" y="32" text-anchor="middle" class="h">5 · Transfer</text>
    <text x="83" y="64" text-anchor="middle" class="l">QUESTION</text>
    <text x="83" y="86" text-anchor="middle" class="q">What can this</text>
    <text x="83" y="103" text-anchor="middle" class="q">student learn?</text>
    <text x="83" y="176" text-anchor="middle" class="w">Adaptive KL</text>
    <text x="83" y="192" text-anchor="middle" class="w">PerSyn</text>
  </g>

  <line class="arr" x1="188" y1="150" x2="203" y2="150" marker-end="url(#a)"/>
  <line class="arr" x1="374" y1="150" x2="389" y2="150" marker-end="url(#a)"/>
  <line class="arr" x1="560" y1="150" x2="575" y2="150" marker-end="url(#a)"/>
  <line class="arr" x1="746" y1="150" x2="761" y2="150" marker-end="url(#a)"/>
  <text x="480" y="300" text-anchor="middle" style="font-size:12px;fill:#8a8f98">All projects shown are work by Chaofan Tao and collaborators</text>
</svg>
