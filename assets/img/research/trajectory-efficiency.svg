<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
  <title id="t">Efficiency per call versus per trajectory</title>
  <desc id="d">Top: an agent with full context reaches a verified result in a few steps. Bottom: each call is cheaper because a detail was dropped from the context, but the agent then needs extra steps to re-read, retry and re-test, so it reaches the verified result later and at a higher total cost.</desc>
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2328}
    .h{font-size:14px;font-weight:600}
    .s{font-size:12px;fill:#4a525c}
    .k{font-size:12px;fill:#8a1f84;font-style:italic}
    .st{fill:#fff;stroke:#b509ac;stroke-width:1.5}
    .lt{fill:#fff;stroke:#d9a6d6;stroke-width:1.5}
    .ex{fill:#fbe3cf;stroke:#e08a3c;stroke-width:1.5}
    .ok{fill:#e6f4ea;stroke:#2e8b57;stroke-width:1.5}
  </style>
  <rect width="900" height="300" rx="14" fill="#f7f7fa"/>

  <text x="24" y="52" class="h">Full context</text>
  <text x="24" y="70" class="s">each call costs more</text>
  <rect class="st" x="200" y="40" width="56" height="40" rx="6"/>
  <rect class="st" x="266" y="40" width="56" height="40" rx="6"/>
  <rect class="st" x="332" y="40" width="56" height="40" rx="6"/>
  <rect class="st" x="398" y="40" width="56" height="40" rx="6"/>
  <rect class="ok" x="464" y="40" width="120" height="40" rx="6"/>
  <text x="524" y="65" text-anchor="middle" class="s">verified result</text>

  <text x="24" y="172" class="h">Detail dropped</text>
  <text x="24" y="190" class="s">each call costs less</text>
  <rect class="lt" x="200" y="160" width="44" height="40" rx="6"/>
  <rect class="lt" x="252" y="160" width="44" height="40" rx="6" style="stroke:#d14343;stroke-width:2"/>
  <text x="274" y="222" text-anchor="middle" class="s" style="fill:#d14343">detail lost</text>
  <rect class="lt" x="304" y="160" width="44" height="40" rx="6"/>
  <rect class="ex" x="356" y="160" width="44" height="40" rx="6"/>
  <rect class="ex" x="408" y="160" width="44" height="40" rx="6"/>
  <rect class="ex" x="460" y="160" width="44" height="40" rx="6"/>
  <rect class="lt" x="512" y="160" width="44" height="40" rx="6"/>
  <rect class="ok" x="564" y="160" width="120" height="40" rx="6"/>
  <text x="624" y="185" text-anchor="middle" class="s">verified result</text>
  <text x="430" y="222" text-anchor="middle" class="s" style="fill:#b5651d">re-read · retry · re-test</text>

  <text x="450" y="272" text-anchor="middle" class="k">saved per call, lost per task: measure the whole trajectory to a verified result</text>
</svg>
